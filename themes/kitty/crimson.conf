# ── Crimson Desktop · Kitty theme ────────────────────────────────────────────
# Included from ~/.config/kitty/kitty.conf (the installer appends one `include` line;
# your own settings above it are preserved, these override them).

# fonts — readable mono for work; the pixel fonts are for the dashboard only
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
font_size        11.5
disable_ligatures cursor

# window
window_padding_width   14 16
hide_window_decorations no
confirm_os_window_close 1
remember_window_size  yes
initial_window_width  110c
initial_window_height 32c
enabled_layouts splits,stack,tall
window_border_width 1pt
active_border_color   #8D2445
inactive_border_color #2A1420
bell_border_color     #D58B9F
inactive_text_alpha   0.82

# transparency: KWin composites it. Blur is requested from KWin via kitty's
# background_blur (works on KDE Plasma Wayland when "Blur" is enabled in Desktop Effects);
# kitty itself never blurs. Profiles rewrite crimson-profile.conf (opacity 1.0 in Performance).
background_opacity 0.88
background_blur 24
dynamic_background_opacity yes
include crimson-profile.conf

# cursor
cursor                #F2B7C5
cursor_text_color     #0B080D
cursor_shape          block
cursor_blink_interval 0.6
cursor_trail          1
cursor_trail_decay    0.08 0.3

# colours
foreground            #E8C9D3
background            #0B080D
selection_foreground  #FFF0F4
selection_background  #8D2445
url_color             #D58B9F
url_style             dotted
mark1_background      #8D2445
mark1_foreground      #FFF0F4

# black
color0  #0B080D
color8  #4A3340
# red / crimson
color1  #C0485F
color9  #E06C84
# green (dusty sage — keeps git diffs legible without leaving the palette)
color2  #8FA88B
color10 #B9D1A6
# yellow (amber rose)
color3  #D6A57A
color11 #EBC39A
# blue (muted violet)
color4  #8A86C2
color12 #ABA8DE
# magenta (dusty pink)
color5  #D58B9F
color13 #F2B7C5
# cyan (muted teal)
color6  #7FA7A8
color14 #A5CFCF
# white
color7  #D9C2CB
color15 #F7EAEF

# tab bar
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_margin_width    6.0
tab_title_template      " {index}:{title[:28]} "
active_tab_foreground   #FFF0F4
active_tab_background   #8D2445
active_tab_font_style   bold
inactive_tab_foreground #A88B98
inactive_tab_background #1A0C13
tab_bar_background      #0B080D

# shortcuts
map ctrl+shift+enter    launch --cwd=current --location=vsplit
map ctrl+shift+minus    launch --cwd=current --location=hsplit
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+left     neighboring_window left
map ctrl+shift+right    neighboring_window right
map ctrl+shift+up       neighboring_window up
map ctrl+shift+down     neighboring_window down
map ctrl+shift+z        toggle_layout stack
map ctrl+shift+a>m      set_background_opacity +0.05
map ctrl+shift+a>l      set_background_opacity -0.05
map ctrl+shift+a>1      set_background_opacity 1
map ctrl+shift+a>d      set_background_opacity default
map ctrl+shift+f5       load_config_file
# Crimson extras
map ctrl+shift+l        launch --type=os-window --title "crimson-lyrics" crimson-lyrics
map ctrl+shift+v>c      launch --type=overlay crimson-cava
map ctrl+shift+i        launch --type=overlay --hold crimsonfetch
